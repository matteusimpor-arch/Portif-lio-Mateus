    <script>
      (function() {
        // Intercept Vite HMR WebSocket connection logs & rejections
        var origErr = console.error;
        var origWarn = console.warn;
        console.error = function() {
          var str = Array.prototype.slice.call(arguments).map(function(item) {
            return typeof item === 'object' ? JSON.stringify(item) : String(item);
          }).join(' ');
          if (
            str.indexOf('failed to connect to websocket') !== -1 ||
            str.indexOf('WebSocket closed without opened') !== -1 ||
            str.indexOf('WebSocket') !== -1 && str.indexOf('closed') !== -1
          ) {
            return;
          }
          origErr.apply(console, arguments);
        };
        console.warn = function() {
          var str = Array.prototype.slice.call(arguments).map(function(item) {
            return typeof item === 'object' ? JSON.stringify(item) : String(item);
          }).join(' ');
          if (
            str.indexOf('failed to connect to websocket') !== -1 ||
            str.indexOf('WebSocket closed') !== -1
          ) {
            return;
          }
          origWarn.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (msg.indexOf('WebSocket closed') !== -1 || msg.indexOf('failed to connect to websocket') !== -1) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason;
          var msg = typeof reason === 'string' ? reason : (reason && reason.message) || '';
          if (
            msg.indexOf('WebSocket closed') !== -1 ||
            msg.indexOf('failed to connect to websocket') !== -1 ||
            msg.indexOf('WebSocket') !== -1
          ) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
